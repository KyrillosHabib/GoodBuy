<div class="container shop-page">
  <header class="shop-head">
    <div class="shop-head-top">
      <nav class="crumbs" aria-label="breadcrumb"><a routerLink="/" class="crumb-home" [attr.aria-label]="'nav.home' | t"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></a><i>›</i><b>{{ 'auth.loginTitle' | t }}</b></nav>
    </div>
    <h1 class="shop-title">{{ 'auth.loginTitle' | t }}</h1>
  </header>
</div>
<div class="container section auth-wrap">
  <div class="auth-card">
    <p class="auth-sub">{{ 'auth.loginSub' | t }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>{{ 'contact.email' | t }}</label>
        <input type="email" formControlName="email" autocomplete="email" dir="ltr" />
        @if (invalid('email')) { <div class="error">{{ 'contact.invalidEmail' | t }}</div> }
      </div>

      <div class="field">
        <label>{{ 'auth.password' | t }}</label>
        <input type="password" formControlName="password" autocomplete="current-password" dir="ltr" />
        @if (invalid('password')) { <div class="error">{{ 'contact.required' | t }}</div> }
      </div>

      <div class="auth-row"><a routerLink="/forgot-password" [queryParams]="{ email: form.value.email || null }">{{ 'auth.forgot' | t }}</a></div>

      <button class="btn btn-primary btn-lg auth-submit" [disabled]="loading()">{{ (loading() ? 'auth.signingIn' : 'auth.signIn') | t }}</button>
    </form>

    <p class="auth-foot">{{ 'auth.noAccount' | t }} <a routerLink="/register" [queryParams]="{ returnUrl: returnUrl }">{{ 'auth.createAccount' | t }}</a></p>
  </div>
</div>
