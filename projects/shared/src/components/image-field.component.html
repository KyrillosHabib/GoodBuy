<div class="field">
  <label>{{ label | t }}</label>
  <div class="image-field">
    @if (control.value) {
      <img class="thumb" [src]="control.value | assetUrl" alt="" />
    } @else {
      <div class="thumb thumb-empty">🖼️</div>
    }

    <div class="grow">
      <input [formControl]="control" dir="ltr" placeholder="https://... or /uploads/..." />
      <div class="row" style="margin-top:.4rem">
        <label class="btn btn-light btn-sm file-btn">
          {{ 'a.upload' | t }}
          <input type="file" accept="image/*" hidden (change)="onFile($event)" />
        </label>
        @if (uploading()) { <span class="muted small">{{ 'a.uploading' | t }}</span> }
        @if (control.value) {
          <button type="button" class="btn btn-light btn-sm" (click)="control.setValue('')">{{ 'a.clear' | t }}</button>
        }
      </div>
    </div>
  </div>
</div>
