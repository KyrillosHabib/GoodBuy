<div class="modal-backdrop" (mousedown)="onBackdrop($event)">
  <div class="modal" [class.modal-lg]="size === 'lg'" [class.modal-xl]="size === 'xl'" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>{{ title }}</h2>
      <button type="button" class="modal-x" aria-label="Close" (click)="closed.emit()">✕</button>
    </div>

    <div class="modal-body"><ng-content /></div>

    <div class="modal-foot"><ng-content select="[modal-footer]" /></div>
  </div>
</div>
